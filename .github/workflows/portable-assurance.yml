name: Portable assurance

# Remote-safe portable Nix checks intentionally do not run for every commit.
# The ordinary commit gate is hard-capped at two minutes; this subset runs twice
# daily and remains manually dispatchable.  LAN-only exhaustive integration
# stays available through the local `test/bin/quality --tier expensive` authority.
on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expensive-assurance
  cancel-in-progress: false

jobs:
  portable-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      # The full expensive tier includes LAN-only consumer checks and remains a
      # local/manual authority.  GitHub runs only its remote-safe portable part.
      - name: Evaluate every portable AI system
        run: test/bin/quality portable-eval

  portable-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        if: runner.os != 'macOS'
      - name: Build portable native integration checks
        run: |
          nix build --no-link \
            "./config/ai#checks.${{ matrix.system }}.pi-extension-tests" \
            "./config/ai#checks.${{ matrix.system }}.pi-gallery"
