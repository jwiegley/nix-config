name: CI

# Lint/format/test jobs delegate scope and execution to test/bin/quality.
#
# Root-host evaluation remains local because the flake still consumes LAN-only
# inputs. Full Python integration remains available through the local/manual expensive
# tier.  Its remote-safe portable evaluation and native builds live in
# portable-assurance.yml (twice daily plus manual dispatch), not on every push or pull
# request.
#
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # On pull requests the verifier and authorized keys must come from the
          # trusted base, never from contributor-controlled head contents.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Fetch the untrusted PR head as objects only
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"
      - name: Verify every introduced commit signature
        env:
          SIGVERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SIGVERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGVERIFY_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
          SIGVERIFY_STRICT: "1"
        run: test/bin/verify-signatures --base "$SIGVERIFY_BASE" --head "$SIGVERIFY_HEAD"

  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - name: Nix format, lint and dead code
        run: |
          nix shell nixpkgs#nixfmt nixpkgs#statix nixpkgs#deadnix \
            -c test/bin/quality nix-format nix-lint nix-deadcode

  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - name: Shell lint and format
        run: |
          nix shell nixpkgs#shellcheck nixpkgs#shfmt \
            -c test/bin/quality shell-lint shell-format

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - name: Python lint and essential tests
        run: >-
          nix shell .#python-test-env nixpkgs#ruff nixpkgs#nixfmt nixpkgs#coreutils nixpkgs#yq
          -c test/bin/quality --python-tier fast
          python-lint python-test
