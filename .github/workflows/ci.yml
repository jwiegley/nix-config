name: CI

# Every lint/format/test job delegates to bin/quality, the single quality
# authority. Do NOT inline a tool invocation or a hand-maintained file list here.
#
# This file used to name 9 shell scripts explicitly while lefthook globbed all of
# bin/* and found 19, so CI was blind to 10 real scripts including bin/switch,
# bin/update-remote and bin/upgrade-all — CI was strictly weaker than the local
# hook. Both also hardcoded the same 4 Python files while the tree tracks 35, and
# neither propagated failure out of its per-file loop.
#
# Scope lives in one place now: `git ls-files`, inside bin/quality.
#
# `bin/quality darwin-surface` is deliberately local/pre-push for now. The root
# flake still consumes a LAN-only ssh://gitea stock-trader input, so a GitHub
# runner cannot evaluate that check honestly until a remote-safe boundary exists.
# Full Python integration remains available through the local/manual expensive
# tier.  Its remote-safe portable evaluation and native builds live in
# portable-assurance.yml (twice daily plus manual dispatch), not on every push or pull
# request.
#
# Refs: jwiegley/nix-config#46.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A pull_request checkout normally creates an unsigned synthetic merge.
          # Verify the actual contributor head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify every introduced commit signature
        env:
          SIGVERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SIGVERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SIGVERIFY_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
          SIGVERIFY_STRICT: "1"
        run: bin/verify-signatures --base "$SIGVERIFY_BASE" --head "$SIGVERIFY_HEAD"

  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Nix format, lint and dead code
        run: |
          nix shell nixpkgs#nixfmt nixpkgs#statix nixpkgs#deadnix \
            -c bin/quality nix-format nix-lint nix-deadcode

  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Shell lint and format
        run: |
          nix shell nixpkgs#shellcheck nixpkgs#shfmt \
            -c bin/quality shell-lint shell-format

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Python lint, essential tests, and coverage regression
        run: >-
          nix shell nixpkgs#ruff nixpkgs#nixfmt nixpkgs#coreutils
          -c bin/quality --python-tier pre-commit
          python-lint python-test coverage
