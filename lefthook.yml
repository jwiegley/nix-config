# Every command here delegates to test/bin/quality, the single quality authority.
#
# Do NOT inline a tool invocation or a file list in this file. That is how these
# hooks and .github/workflows/ci.yml drifted apart badly enough that CI checked 9
# shell scripts while this file checked 19, and how a 45-line shfmt diff in
# bin/update passed every gate: the old loops here did not propagate
# failure, so the loop exited with the status of its last iteration and a bad file
# in the middle was invisible.
#
# Scope now lives in exactly one place — `git ls-files`, inside test/bin/quality. The
# globs below only decide *when* a suite runs; what it covers is test/bin/quality's
# business, so a newly tracked file is in scope without editing anything here.
#
# Refs: jwiegley/nix-config#46.

pre-commit:
  commands:
    quality-tier:
      run: test/bin/quality --tier pre-commit

pre-push:
  # Pre-push gates validate the revision's complete tree, not the diff that happens
  # to remain against one remote. A push-mirror can make {push_files} empty before
  # this hook runs; using the tracked tree keeps the gate non-vacuous in that case.
  # The existing config path keeps the custom-file command non-empty even for an
  # empty index. It is consumed by the leading `:` and is never read as an input.
  files: '{ git ls-files; printf "%s\n" lefthook.yml; }'
  commands:
    # Evaluates vulcan, vps and the shared-work class against THIS tree, so a
    # change here that would break a consumer fails before it is published rather
    # than at the consumer's next lock bump. Deliberately pre-push and not
    # pre-commit: it is targeted but still costs real nix eval time.
    consumer-eval:
      run: ": {files}; test/bin/quality consumer-eval"
    # The local mirror of CI's signatures job (#23). Pre-push, because that is
    # the last moment an unsigned commit can be caught before it becomes someone
    # else's problem -- and it costs a few git calls, not a build.
    #
    # This does NOT bypass anything: it runs test/bin/quality signatures, the same
    # authority CI invokes, and test/bin/verify-signatures refuses rather than guessing
    # when it cannot determine what is unpublished.
    signatures:
      run: ": {files}; test/bin/quality signatures"
    python-coverage:
      run: ": {files}; test/bin/quality --python-tier pre-push python-test coverage"
    coverage-live:
      run: ": {files}; test/bin/quality coverage-live"
    agent-checks:
      run: >-
        : {files};
        nix build --no-link
        .#checks.aarch64-darwin.agent-resources
        .#checks.aarch64-darwin.agent-wrappers
        .#checks.aarch64-darwin.pi-gallery
    darwin-surface:
      run: ": {files}; test/bin/quality darwin-surface"
    system-build:
      run: ": {files}; ./build system"
