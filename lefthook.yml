# Every command here delegates to bin/quality, the single quality authority.
#
# Do NOT inline a tool invocation or a file list in this file. That is how these
# hooks and .github/workflows/ci.yml drifted apart badly enough that CI checked 9
# shell scripts while this file checked 19, and how a 45-line shfmt diff in
# bin/update-agents passed every gate: the old loops here did not propagate
# failure, so the loop exited with the status of its last iteration and a bad file
# in the middle was invisible.
#
# Scope now lives in exactly one place — `git ls-files`, inside bin/quality. The
# globs below only decide *when* a suite runs; what it covers is bin/quality's
# business, so a newly tracked file is in scope without editing anything here.
#
# Refs: jwiegley/nix-config#46.

pre-commit:
  parallel: true
  commands:
    nix-format:
      glob: "*.nix"
      run: bin/quality nix-format
    nix-lint:
      glob: "*.nix"
      run: bin/quality nix-lint
    nix-deadcode:
      glob: "*.nix"
      run: bin/quality nix-deadcode
    shell-lint:
      glob: "{bin/*,build,*.sh,*.bash}"
      run: bin/quality shell-lint
    shell-format:
      glob: "{bin/*,build,*.sh,*.bash}"
      run: bin/quality shell-format
    python-lint:
      glob: "{*.py,bin/update-overlay}"
      run: bin/quality python-lint
    python-test:
      glob: "{*.py,bin/update-overlay}"
      run: bin/quality python-test
    nix-check:
      glob: "*.{nix,lock}"
      run: bin/quality portable-eval

pre-push:
  commands:
    # Evaluates vulcan, vps and the shared-work class against THIS tree, so a
    # change here that would break a consumer fails before it is published rather
    # than at the consumer's next lock bump. Deliberately pre-push and not
    # pre-commit: it is targeted but still costs real nix eval time.
    consumer-eval:
      run: bin/quality consumer-eval
    agent-checks:
      run: >-
        nix build --no-link
        .#checks.aarch64-darwin.agent-resources
        .#checks.aarch64-darwin.agent-wrappers
        .#checks.aarch64-darwin.ai-home-manager-contract
        .#checks.aarch64-darwin.pi-gallery
    system-build:
      run: ./build system
